name: KerjaDesa Production Version Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check production version identity
        env:
          PRODUCTION_URL: https://kerjadesa-pro.blitz.cloud
        shell: bash
        run: |
          set -euo pipefail
          fetch_json() {
            local endpoint="$1"
            local output="$2"
            local status
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 --max-time 30 -o "$output" -w '%{http_code}' "$PRODUCTION_URL$endpoint" || true)"
            echo "GET $endpoint -> HTTP $status"
            cat "$output" || true
            echo
            if [ "$status" != "200" ]; then
              echo "Production endpoint check failed for $endpoint (HTTP $status)."
              exit 1
            fi
          }
          fetch_json /api/version /tmp/version.json
          fetch_json /api/health /tmp/health.json
          fetch_json /api/health/drp /tmp/drp-health.json
          # Safe authentication health probe: never uses a real account or password.
          auth_status="$(curl --silent --show-error --retry 2 --retry-delay 1 --max-time 30 \\
            -H 'Content-Type: application/json' \\            -o /tmp/auth-probe.json -w '%{http_code}' \
            -X POST "$PRODUCTION_URL/api/auth/login" \\            --data '{"username":"__kerjadesa_healthcheck__","password":"Invalid-HealthCheck-20261006-Only"}' || true)"
          echo "POST /api/auth/login (invalid probe) -> HTTP $auth_status"
          cat /tmp/auth-probe.json || true
          echo
          if [ "$auth_status" != "401" ]; then
            echo "Production authentication endpoint is unhealthy or misconfigured; expected HTTP 401 for invalid credentials."
            exit 1
          fi

          version_json="$(cat /tmp/version.json)"
          health_json="$(cat /tmp/health.json)"
          drp_json="$(cat /tmp/drp-health.json)"
          printf '%s\n' "$version_json"
          printf '%s\n' "$health_json"
          printf '%s\n' "$drp_json"
          node - "$GITHUB_SHA" "$version_json" "$health_json" "$drp_json" <<'NODE'
          const expected = process.argv[2];
          const version = JSON.parse(process.argv[3]);
          const health = JSON.parse(process.argv[4]);
          const drp = JSON.parse(process.argv[5]);
          if (!version.success) throw new Error('Production /api/version returned success=false');
          if (version.commit !== expected) {
            throw new Error('Production commit mismatch: expected ' + expected + ', got ' + version.commit);
          }
          if (!health.success) throw new Error('Production /api/health is not healthy');
          if (!drp.success) throw new Error('Production /api/health/drp is not healthy');
          if (!drp.pdftotext && !drp.pdf_parse) throw new Error('Production PDF extractor is unavailable');
          console.log(JSON.stringify({
            status: 'PASS',
            expected_commit: expected,
            production_commit: version.commit,
            environment: version.environment,
            drp_extractor: drp.pdf_extractor || drp.extractor || null,
            pdftotext: !!drp.pdftotext,
            pdf_parse: !!drp.pdf_parse
          }, null, 2));
          NODE
