name: KerjaDesa GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure secure frontend runtime
        env:
          API_BASE: ${{ vars.KERJADESA_API_BASE }}
        run: |
          API_BASE="${API_BASE:-https://kerjadesa-pro.blitz.cloud/api}"
          cat > js/deployment-config.js <<EOF
          // Generated by GitHub Actions. Do not add secrets here.
          window.KERJADESA_API_BASE = '${API_BASE}';
          // Production authentication is server-backed; never ship a hardcoded offline credential.
          window.KERJADESA_ALLOW_OFFLINE_LOGIN = false;
          (function(){
            var css=document.createElement('link');
            css.rel='stylesheet';
            css.href='./css/integrated-domain-modules.css';
            document.head.appendChild(css);
          })();
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
