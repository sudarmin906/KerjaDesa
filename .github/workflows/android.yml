name: Build KerjaDesa Android V28 FINAL

on:
  workflow_dispatch:
  push:
    paths:
      - "KerjaDesa_Android_V28_FINAL.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      PATH: /usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:/usr/local/bin:/usr/bin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V28 FINAL
        run: |
          rm -rf android_build
          mkdir -p android_build
          unzip -q KerjaDesa_Android_V28_FINAL.zip -d android_build

          echo "=== PROJECT ==="
          ls -la android_build/KerjaDesa_Android_V28

          test -f android_build/KerjaDesa_Android_V28/settings.gradle
          test -f android_build/KerjaDesa_Android_V28/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          echo "=== INSTALLED SDK ==="
          "$SDKMANAGER" --list_installed

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Verify tools
        run: |
          java -version
          gradle --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"

      - name: Build APK
        working-directory: android_build/KerjaDesa_Android_V28
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK="android_build/KerjaDesa_Android_V28/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"
          ls -lh "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "APK SIZE: $SIZE bytes"

          test "$SIZE" -gt 10000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KerjaDesa-V28-APK
          path: android_build/KerjaDesa_Android_V28/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
