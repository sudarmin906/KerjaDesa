name: Build KerjaDesa Android V28

on:
  workflow_dispatch:
  push:
    paths:
      - "KerjaDesa_Android_V28.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract V28
        run: |
          rm -rf android_build
          mkdir android_build
          unzip -q KerjaDesa_Android_V28.zip -d android_build

          echo "=== CEK V28 ==="
          ls -la android_build/KerjaDesa_Android_V28

          test -f android_build/KerjaDesa_Android_V28/settings.gradle
          test -f android_build/KerjaDesa_Android_V28/app/build.gradle

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build APK
        working-directory: android_build/KerjaDesa_Android_V28
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android_build/KerjaDesa_Android_V28/app/build/outputs/apk/debug/app-debug.apk"

          echo "=== APK HASIL BUILD ==="
          ls -lh "$APK"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")
          echo "APK SIZE: $SIZE bytes"

          test "$SIZE" -gt 100000

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KerjaDesa-V28-APK
          path: android_build/KerjaDesa_Android_V28/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
