name: Build KerjaDesa Android

on:
  workflow_dispatch:
  push:
    paths:
      - "KerjaDesa_Android_V26.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android V26
        run: |
          mkdir -p android_build
          unzip -q KerjaDesa_Android_V26.zip -d android_build
          ls -la android_build/KerjaDesa_Android_V26

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH

          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK and AAB
        working-directory: android_build/KerjaDesa_Android_V26
        run: |
          gradle assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KerjaDesa-APK
          path: |
            android_build/KerjaDesa_Android_V26/app/build/outputs/apk/debug/app-debug.apk
            android_build/KerjaDesa_Android_V26/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: KerjaDesa-AAB-PlayStore
          path: |
            android_build/KerjaDesa_Android_V26/app/build/outputs/bundle/release/app-release.aab
