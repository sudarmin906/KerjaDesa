name: KerjaDesa Quality Gate

on:
  push:
    branches: [main, build-215-devops-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); console.log('manifest.json OK')"

      - name: Validate JavaScript embedded in index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No inline script blocks found in index.html")
          out = Path(".ci-inline-js")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts, 1):
              (out / f"script-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} script block(s)")
          PY
          failed=0
          for f in .ci-inline-js/*.js; do
            echo "Checking $f"
            if ! node --check "$f"; then
              failed=1
            fi
          done
          exit $failed

      - name: Validate referenced local assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          refs = set()
          for pattern in (
              r"""href=["'\"]([^"'\"]+)["'\"]""",
              r"""src=["'\"]([^"'\"]+)["'\"]""",
          ):
              refs.update(re.findall(pattern, html, flags=re.I))
          missing = []
          for ref in sorted(refs):
              if ref.startswith(("#", "http://", "https://", "data:", "blob:", "javascript:")):
                  continue
              clean = ref.split("?", 1)[0].split("#", 1)[0]
              if not clean or clean.startswith("/"):
                  continue
              if not Path(clean).exists():
                  missing.append(clean)
          if missing:
              print("Missing local assets:")
              for item in missing:
                  print(f" - {item}")
              raise SystemExit(1)
          print("Referenced local assets OK")
          PY

      - name: Validate integrated frontend JavaScript
        shell: bash
        run: |
          node --check js/integrated-domain-modules.js
          node --check js/deployment-config.js
          test -f css/integrated-domain-modules.css
          echo "Integrated frontend assets OK"

      - name: Validate backend JavaScript
        shell: bash
        run: |
          for f in backend/server.js backend/database/*.js backend/controllers/*.js backend/middleware/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Backend smoke test
        shell: bash
        run: |
          PORT=4317 node backend/server.js > /tmp/kerjadesa-api.log 2>&1 &
          pid=$!
          trap "kill $pid" EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4317/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kerjadesa-api.log
          exit 1


      - name: End-to-end API authentication and authorization test
        shell: bash
        run: |
          rm -rf backend/data
          PORT=4318 ADMIN_PASSWORD=ci-test-password node backend/server.js > /tmp/kerjadesa-e2e.log 2>&1 &
          pid=$!
          trap "kill $pid" EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4318/api/health >/dev/null && break
            sleep 1
          done
          login=$(curl -fsS -c /tmp/kd-cookies.txt -X POST http://127.0.0.1:4318/api/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-test-password"}')
          node -e "const x=JSON.parse(process.argv[1]); if(!x.success || x.token) process.exit(1)" "$login"
          csrf=$(awk '$6=="kd_csrf" || $6=="__Host-kd_csrf" {print $7}' /tmp/kd-cookies.txt)
          test -n "$csrf"
          curl -fsS -b /tmp/kd-cookies.txt http://127.0.0.1:4318/api/auth/me >/tmp/me.json
          curl -fsS -b /tmp/kd-cookies.txt http://127.0.0.1:4318/api/dashboard >/tmp/dashboard.json
          code=$(curl -s -o /tmp/static-leak.txt -w '%{http_code}' http://127.0.0.1:4318/backend/server.js)
          test "$code" = "404"
          code=$(curl -s -o /tmp/env-leak.txt -w '%{http_code}' http://127.0.0.1:4318/.env)
          test "$code" = "404"
          code=$(curl -s -o /tmp/no-csrf.txt -w '%{http_code}' -X POST -b /tmp/kd-cookies.txt -H 'Content-Type: application/json' -d '{"judul":"No CSRF"}' http://127.0.0.1:4318/api/kegiatan)
          test "$code" = "403"
          curl -fsS -X POST -b /tmp/kd-cookies.txt -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -d '{"judul":"CI Test","status":"RENCANA"}' http://127.0.0.1:4318/api/kegiatan >/tmp/create.json
          id=$(node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/create.json')); process.stdout.write(String(x.data.id))")
          curl -fsS -X PATCH -b /tmp/kd-cookies.txt -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -d '{"status":"SELESAI","base_version":1}' http://127.0.0.1:4318/api/kegiatan/$id >/tmp/update.json
          curl -fsS -X DELETE -b /tmp/kd-cookies.txt -H "X-CSRF-Token: $csrf" http://127.0.0.1:4318/api/kegiatan/$id >/tmp/delete.json
          curl -fsS -b /tmp/kd-cookies.txt http://127.0.0.1:4318/api/audit_log >/tmp/audit.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/audit.json')); if(!x.success || !x.data.some(a=>a.action==='CREATE')) process.exit(1)"
          curl -fsS -X POST -b /tmp/kd-cookies.txt -H "X-CSRF-Token: $csrf" -H 'Content-Type: application/json' -d '{"nama_lengkap":"CI Operator","username":"ci-operator","password":"ci-operator-password","role":"OPERATOR","desa":"","status":"ACTIVE"}' http://127.0.0.1:4318/api/users >/tmp/operator.json
          login2=$(curl -fsS -c /tmp/kd-operator-cookies.txt -X POST http://127.0.0.1:4318/api/auth/login -H 'Content-Type: application/json' -d '{"username":"ci-operator","password":"ci-operator-password"}')
          node -e "const x=JSON.parse(process.argv[1]); if(!x.success||x.token) process.exit(1)" "$login2"
          csrf2=$(awk '$6=="kd_csrf" || $6=="__Host-kd_csrf" {print $7}' /tmp/kd-operator-cookies.txt)
          test -n "$csrf2"
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/operator.json')); if(!x.success||x.data.role!=='OPERATOR') process.exit(1)"
          rows=$(curl -fsS -b /tmp/kd-operator-cookies.txt http://127.0.0.1:4318/api/kegiatan)
          node -e "const x=JSON.parse(process.argv[1]); if(!x.success||x.data.length!==0) process.exit(1)" "$rows"
          code=$(curl -s -o /tmp/operator-create.txt -w '%{http_code}' -X POST -b /tmp/kd-operator-cookies.txt -H "X-CSRF-Token: $csrf2" -H 'Content-Type: application/json' -d '{"judul":"Cross Village Test"}' http://127.0.0.1:4318/api/kegiatan)
          test "$code" = "403"
          echo "E2E API cookie+CSRF test OK"

      - name: PostgreSQL repository syntax and isolated fallback smoke test
        shell: bash
        run: |
          node --check backend/postgres-migrate.js
          rm -rf backend/data
          PORT=4319 ADMIN_PASSWORD=ci-test-password node backend/server.js > /tmp/kerjadesa-fallback.log 2>&1 &
          pid=$!
          trap "kill $pid" EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4319/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:4319/api/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-test-password"}' >/tmp/login.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/login.json')); if(!x.success||x.token) process.exit(1)"
          echo "Production repository code and fallback smoke test OK"

      - name: Build Railway production image
        run: docker build -f Dockerfile.railway -t kerjadesa-railway-ci .

      - name: Validate service worker cache manifest
        shell: bash
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('sw.js','utf8'); if(!s.includes('const CACHE=')){throw new Error('CACHE constant missing in sw.js')} if(!s.includes('const ASSETS=')){throw new Error('ASSETS constant missing in sw.js')} console.log('sw.js OK')"
