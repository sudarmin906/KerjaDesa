<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Aktivasi Admin — KerjaDesa Pro</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07111f,#10253d 55%,#07111f);color:#eef5ff;padding:24px}
.card{width:min(100%,520px);background:rgba(12,25,42,.96);border:1px solid #27445f;border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#173b59;color:#9fd4ff;font-size:12px;font-weight:700;letter-spacing:.04em}
h1{margin:16px 0 8px;font-size:28px}p{color:#aebfd1;line-height:1.55}
label{display:block;margin:16px 0 7px;font-weight:650;font-size:14px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #35526e;background:#081725;color:#fff;outline:none}
input:focus{border-color:#6bbcff;box-shadow:0 0 0 3px rgba(107,188,255,.12)}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#2e8cff;color:white;font-weight:800;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.note{font-size:12px;color:#8398ad;margin-top:14px}
.status{margin-top:16px;padding:12px;border-radius:12px;display:none;line-height:1.45}
.status.ok{display:block;background:#103524;color:#a7efc2}
.status.err{display:block;background:#3a1820;color:#ffc1ca}
a{color:#8ecbff}
</style>
</head>
<body>
<main class="card">
  <span class="badge">SECURE ADMIN BOOTSTRAP</span>
  <h1>Aktivasi Admin KerjaDesa</h1>
  <p>Halaman ini hanya dapat membuat akun ADMIN ketika database belum memiliki pengguna dan server menyediakan <code>ADMIN_BOOTSTRAP_TOKEN</code>.</p>

  <form id="bootstrapForm" autocomplete="off">
    <label for="token">Bootstrap Token</label>
    <input id="token" name="bootstrap_token" type="password" autocomplete="off" required minlength="32">

    <label for="username">Username Admin</label>
    <input id="username" name="username" value="admin" autocomplete="username" minlength="3" maxlength="64" pattern="[A-Za-z0-9._-]{3,64}" required>

    <label for="password">Password Admin</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>

    <label for="confirm">Ulangi Password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>

    <label for="name">Nama Lengkap</label>
    <input id="name" name="nama_lengkap" value="Administrator KerjaDesa" maxlength="120" autocomplete="name">

    <button id="submitBtn" type="submit">Buat Akun Admin</button>
  </form>

  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div class="note">Jangan membagikan bootstrap token. Setelah akun berhasil dibuat, endpoint bootstrap otomatis berhenti dapat digunakan.</div>
</main>
<script>
(() => {
  const form=document.getElementById('bootstrapForm');
  const btn=document.getElementById('submitBtn');
  const status=document.getElementById('status');
  const show=(message,ok=false)=>{status.textContent=message;status.className='status '+(ok?'ok':'err')};
  form.addEventListener('submit',async(event)=>{
    event.preventDefault();
    const token=document.getElementById('token').value;
    const username=document.getElementById('username').value.trim();
    const password=document.getElementById('password').value;
    const confirm=document.getElementById('confirm').value;
    const nama_lengkap=document.getElementById('name').value.trim();
    if(password!==confirm){show('Konfirmasi password tidak sama.');return}
    if(password.length<15){show('Password minimal 15 karakter.');return}
    btn.disabled=true;
    show('Memproses aktivasi admin...',true);
    try{
      const response=await fetch('/api/auth/bootstrap',{
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        cache:'no-store',
        body:JSON.stringify({bootstrap_token:token,username,password,nama_lengkap})
      });
      const data=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(data.message||'Aktivasi admin gagal.');
      form.reset();
      document.getElementById('username').value='admin';
      document.getElementById('name').value='Administrator KerjaDesa';
      show('Akun ADMIN berhasil dibuat. Silakan kembali ke halaman login KerjaDesa dan masuk menggunakan akun yang baru dibuat.',true);
    }catch(error){
      show(error.message||'Aktivasi admin gagal.');
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
