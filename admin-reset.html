<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KerjaDesa — Reset Admin</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#111;color:#eee;margin:0;padding:24px}
main{max-width:520px;margin:5vh auto;background:#1b1b1b;border:1px solid #333;border-radius:16px;padding:24px}
h1{font-size:22px;margin-top:0} label{display:block;margin:16px 0 6px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #555;background:#0e0e0e;color:#fff}
button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;font-weight:700;cursor:pointer}
.note{font-size:13px;color:#aaa;line-height:1.5}.msg{margin-top:16px;font-weight:600}
.warn{color:#ffd166}
</style>
</head>
<body>
<main>
<h1>Reset Password Admin KerjaDesa</h1>
<p class="note warn">Halaman sementara. Gunakan hanya untuk pemulihan akun. Setelah login berhasil, segera ubah <code>ADMIN_RESET_ENABLED</code> menjadi <code>false</code> atau hapus variabel tersebut lalu restart aplikasi.</p>
<form id="f">
<label>Reset Token</label>
<input id="token" type="password" autocomplete="off" required>
<label>Username Admin</label>
<input id="username" value="admin" autocomplete="username" required>
<label>Password Baru</label>
<input id="password" type="password" autocomplete="new-password" minlength="15" required>
<label>Ulangi Password Baru</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="15" required>
<button type="submit">Reset Password Admin</button>
</form>
<div id="msg" class="msg"></div>
</main>
<script>
const form=document.getElementById('f'),msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
 e.preventDefault(); msg.textContent='Memproses...';
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirm').value;
 if(password!==confirm){msg.textContent='Password dan konfirmasi tidak sama.';return;}
 if(password.length<15){msg.textContent='Password minimal 15 karakter.';return;}
 try{
  const r=await fetch('/api/auth/reset-admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   reset_token:document.getElementById('token').value,
   username:document.getElementById('username').value.trim(),
   password
  })});
  const d=await r.json().catch(()=>({}));
  msg.textContent=d.message||'Permintaan selesai.';
  if(d.success) form.reset();
 }catch(err){msg.textContent='Gagal terhubung ke server.';}
});
</script>
</body>
</html>
